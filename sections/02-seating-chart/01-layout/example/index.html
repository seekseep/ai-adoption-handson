<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>座席表</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <h1>座席表</h1>

    <div class="layout">
      <section class="panel">
        <h2>座席のマップ</h2>
        <p class="hint">
          1 行が横 1 列分です。席の名前を空白で区切って書きます。<code>.</code> は通路になります。
        </p>
        <textarea id="map" rows="8" spellcheck="false"></textarea>
        <button id="draw" type="button">座席表を作る</button>
      </section>

      <section class="panel">
        <h2>できた座席表</h2>
        <div id="chart" class="chart"></div>
      </section>
    </div>
  </body>
</html>
