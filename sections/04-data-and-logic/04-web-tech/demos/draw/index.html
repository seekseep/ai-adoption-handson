<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>図を描く</title>
    <style>
:root { color-scheme: light; }
      body {
        margin: 0; padding: 18px 16px 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.6; color: #1f2933; background: #f7f8fa;
      }
      h1 { margin: 0 0 4px; font-size: 0.95rem; }
      .lead { margin: 0 0 14px; font-size: 0.78rem; color: #616e7c; }
      .card { padding: 14px; background: #fff; border: 1px solid #d8dee6; border-radius: 8px; }
      label { display: block; margin-bottom: 4px; font-size: 0.75rem; color: #616e7c; }
      input[type="text"], input[type="number"], select {
        box-sizing: border-box; width: 100%; padding: 6px 8px; font-family: inherit;
        font-size: 0.85rem; border: 1px solid #cbd2d9; border-radius: 6px; background: #fff;
      }
      button {
        padding: 7px 16px; font-family: inherit; font-size: 0.82rem; color: #fff;
        background: #2b6cb0; border: none; border-radius: 6px; cursor: pointer;
      }
      table { width: 100%; font-size: 0.8rem; border-collapse: collapse; }
      th, td { padding: 5px 8px; text-align: left; border-bottom: 1px solid #e3e8ee; }
      th { font-size: 0.7rem; color: #616e7c; background: #f4f6f8; }
      canvas { display: block; width: 100%; max-width: 560px; height: auto; }
      textarea {
        box-sizing: border-box; width: 100%; height: 100px; padding: 8px; margin-bottom: 10px;
        font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem;
        border: 1px solid #cbd2d9; border-radius: 6px;
      }
    </style>
    <script src="main.js" defer></script>
  </head>
  <body>
    <h1>図を描く</h1>
    <p class="lead">数字を書き換えると、グラフが描き直されます。画像を用意しているわけではありません。</p>

    <div class="card">
      <label for="data">データ（<code>ラベル 数値</code>）</label>
      <textarea id="data" spellcheck="false"></textarea>
      <canvas id="canvas" width="560" height="240"></canvas>
    </div>
  </body>
</html>
