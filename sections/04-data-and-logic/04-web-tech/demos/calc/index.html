<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>計算する</title>
    <style>
:root { color-scheme: light; }
      body {
        margin: 0; padding: 18px 16px 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.6; color: #1f2933; background: #f7f8fa;
      }
      h1 { margin: 0 0 4px; font-size: 0.95rem; }
      .lead { margin: 0 0 14px; font-size: 0.78rem; color: #616e7c; }
      .card { padding: 14px; background: #fff; border: 1px solid #d8dee6; border-radius: 8px; }
      label { display: block; margin-bottom: 4px; font-size: 0.75rem; color: #616e7c; }
      input[type="text"], input[type="number"], select {
        box-sizing: border-box; width: 100%; padding: 6px 8px; font-family: inherit;
        font-size: 0.85rem; border: 1px solid #cbd2d9; border-radius: 6px; background: #fff;
      }
      button {
        padding: 7px 16px; font-family: inherit; font-size: 0.82rem; color: #fff;
        background: #2b6cb0; border: none; border-radius: 6px; cursor: pointer;
      }
      table { width: 100%; font-size: 0.8rem; border-collapse: collapse; }
      th, td { padding: 5px 8px; text-align: left; border-bottom: 1px solid #e3e8ee; }
      th { font-size: 0.7rem; color: #616e7c; background: #f4f6f8; }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
      .out { margin-top: 14px; padding: 12px; font-size: 0.85rem; background: #f4f6f8; border-radius: 6px; }
      .out strong { font-size: 1.1rem; color: #2b6cb0; }
    </style>
    <script src="main.js" defer></script>
  </head>
  <body>
    <h1>計算する</h1>
    <p class="lead">数字を入れると、打ち直さなくてもその場で計算し直します。</p>

    <div class="card">
      <div class="grid">
        <div>
          <label for="price">税抜の金額</label>
          <input id="price" type="number" value="12800" />
        </div>
        <div>
          <label for="rate">消費税率（%）</label>
          <input id="rate" type="number" value="10" />
        </div>
        <div>
          <label for="people">割る人数</label>
          <input id="people" type="number" value="7" />
        </div>
      </div>
      <div class="out" id="out"></div>
    </div>
  </body>
</html>
