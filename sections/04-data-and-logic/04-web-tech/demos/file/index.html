<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ファイルを読む・書き出す</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; padding: 18px 16px 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.6; color: #1f2933; background: #f7f8fa;
      }
      h1 { margin: 0 0 4px; font-size: 0.95rem; }
      .lead { margin: 0 0 14px; font-size: 0.78rem; color: #616e7c; }
      .card { padding: 14px; background: #fff; border: 1px solid #d8dee6; border-radius: 8px; }
      .drop {
        padding: 18px; margin-bottom: 12px; font-size: 0.82rem; text-align: center;
        color: #616e7c; background: #fbfcfd; border: 2px dashed #cbd2d9; border-radius: 8px;
      }
      button {
        padding: 7px 16px; font-family: inherit; font-size: 0.82rem; color: #fff;
        background: #2b6cb0; border: none; border-radius: 6px; cursor: pointer;
      }
      button:disabled { background: #cbd2d9; cursor: default; }
      table { width: 100%; font-size: 0.8rem; border-collapse: collapse; margin-bottom: 12px; }
      th, td { padding: 5px 8px; text-align: left; border-bottom: 1px solid #e3e8ee; }
      th { font-size: 0.7rem; color: #616e7c; background: #f4f6f8; }
      .status { margin: 0 0 10px; font-size: 0.78rem; color: #2f855a; }
    </style>
    <script src="main.js" defer></script>
  </head>
  <body>
    <h1>ファイルを読む・書き出す</h1>
    <p class="lead">
      自分で選んだファイルをブラウザが読み、加工して保存し直します。
      この間、ファイルはどこにも送られていません。
    </p>

    <div class="card">
      <div class="drop">
        CSV ファイルを選んでください
        <div style="margin-top:8px"><input id="picker" type="file" accept=".csv,.txt" /></div>
        <div style="margin-top:8px; font-size:0.72rem">
          手元に無ければ、下の「サンプルを作る」を押すと 1 つ書き出せます。
        </div>
      </div>

      <p id="status" class="status"></p>
      <table>
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table>

      <p>
        <button id="sample" type="button">サンプルを作る</button>
        <button id="save" type="button" disabled>読み込んだ内容を保存し直す</button>
      </p>
    </div>
  </body>
</html>
