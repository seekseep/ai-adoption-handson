<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>データからデータを作る</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; padding: 18px 16px 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.6; color: #1f2933; background: #f7f8fa;
      }
      h1 { margin: 0 0 14px; font-size: 0.95rem; }
      .cols { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
      .col { flex: 1 1 260px; min-width: 0; }
      h2 { margin: 0 0 6px; font-size: 0.72rem; color: #616e7c; letter-spacing: .04em; }
      textarea {
        display: block; width: 100%; box-sizing: border-box; height: 190px; padding: 8px;
        font-family: ui-monospace, Consolas, monospace; font-size: 0.75rem; line-height: 1.6;
        background: #fff; border: 1px solid #cbd2d9; border-radius: 6px; resize: vertical;
      }
      table { width: 100%; font-size: 0.75rem; border-collapse: collapse; background: #fff;
        border: 1px solid #cbd2d9; border-radius: 6px; overflow: hidden; }
      th, td { padding: 5px 8px; text-align: left; border-bottom: 1px solid #e3e8ee; }
      th { font-size: 0.68rem; color: #616e7c; background: #f4f6f8; }
      .arrow { display: grid; place-items: center; flex: 0 0 28px; padding-top: 34px;
        font-size: 1.2rem; color: #9aa5b1; }
      .count { margin: 8px 0 0; font-size: 0.72rem; color: #616e7c; }
    </style>
    <script src="main.js" defer></script>
  </head>
  <body>
    <h1>そのまま使えない名簿を、表の形に整える</h1>
    <div class="cols">
      <div class="col">
        <h2>入力（もらったままの名簿）</h2>
        <textarea id="input" spellcheck="false"></textarea>
      </div>
      <div class="arrow">→</div>
      <div class="col">
        <h2>出力（整えた表）</h2>
        <table>
          <thead><tr><th>氏名</th><th>部署</th><th>内線</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="count" class="count"></p>
      </div>
    </div>
  </body>
</html>
